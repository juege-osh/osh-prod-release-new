spring:
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8080

app:
  jwt:
    issuer: osh-release-governance
    secret: ${APP_JWT_SECRET:osh-release-governance-secret-key-change-me}
    ttl-seconds: ${APP_JWT_TTL_SECONDS:86400}
  seed-users:
    juege-password: ${OSH_SEED_JUEGE_PASSWORD:}
    reviewer-a-password: ${OSH_SEED_REVIEWER_A_PASSWORD:}
    reviewer-b-password: ${OSH_SEED_REVIEWER_B_PASSWORD:}
    ops-password: ${OSH_SEED_OPS_PASSWORD:}
  cors:
    allowed-origins:
      - "*"
